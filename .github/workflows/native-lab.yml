name: Native lab build
on:
  workflow_dispatch:
  push:
    paths: ['lab/**', '.github/workflows/native-lab.yml']
concurrency:
  group: native-lab
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: Valenced/valenced, path: valenced-src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - name: Build the Valenced API from its public source
        working-directory: valenced-src
        run: ./gradlew :core:publishToMavenLocal :android:api:publishToMavenLocal -x test --no-daemon
      - name: Build the lab plugins
        run: ./valenced-src/gradlew -p lab :avatar-lab:dexJar :chat-animator:dexJar :always-animate-native:dexJar --no-daemon
      - name: Package
        run: |
          mkdir -p out
          for d in lab/avatar-lab lab/chat-animator; do
            cp "$d/build/outputs/plugin/plugin.jar" "$d/plugin.jar"
            id=$(sed -nE 's/.*"id": "([^"]+)".*/\1/p' "$d/manifest.json" | head -1)
            v=$(sed -nE 's/.*"version": "([^"]+)".*/\1/p' "$d/manifest.json" | head -1)
            (cd "$d" && zip -qX "../../out/$id@$v.zip" manifest.json index.js plugin.jar)
          done
          # Always Animate: its own files (plugins/always-animate) plus the native jar
          d=plugins/always-animate
          cp lab/always-animate-native/build/outputs/plugin/plugin.jar "$d/plugin.jar"
          v=$(sed -nE 's/.*"version": "([^"]+)".*/\1/p' "$d/manifest.json" | head -1)
          (cd "$d" && zip -qX "../../out/marklong.always-animate@$v.zip" manifest.json index.js plugin.jar)
      - uses: actions/upload-artifact@v4
        with: { name: lab-zips, path: out/*.zip }
      - name: Publish the zips on the lab-builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan lab-builds
          git rm -rf -q . || true
          cp out/*.zip .
          git add *.zip
          git commit -qm "lab build ${GITHUB_SHA}"
          for i in 1 2 3 4 5; do git push -f origin lab-builds && break; sleep $((i*5)); done
          git ls-remote --heads origin lab-builds | grep -q "$(git rev-parse HEAD)"
