name: Native lab build
on:
  workflow_dispatch:
  push:
    paths: ['lab/**', '.github/workflows/native-lab.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: Valenced/valenced, path: valenced-src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - name: Build the Valenced API from its public source
        working-directory: valenced-src
        run: ./gradlew :core:publishToMavenLocal :android:api:publishToMavenLocal -x test --no-daemon
      - name: Build the lab plugins
        run: ./valenced-src/gradlew -p lab :avatar-lab:dexJar --no-daemon
      - name: Package
        run: |
          mkdir -p out && cd lab/avatar-lab
          cp build/outputs/plugin/plugin.jar . 
          v=$(sed -nE 's/.*"version": "([^"]+)".*/\1/p' manifest.json | head -1)
          zip -qX "../../out/marklong.avatar-lab@$v.zip" manifest.json index.js plugin.jar
      - uses: actions/upload-artifact@v4
        with: { name: lab-zips, path: out/*.zip }
